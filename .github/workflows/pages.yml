name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Supabase build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.PAGES_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PAGES_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is empty or unavailable to the build job."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is empty or unavailable to the build job."
            exit 1
          fi
          EXPECTED_PROJECT_REF="aubjgaiyimvwiijziptw"
          ACTUAL_PROJECT_REF="${VITE_SUPABASE_URL#https://}"
          ACTUAL_PROJECT_REF="${ACTUAL_PROJECT_REF%%.*}"
          if [ "$ACTUAL_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error::DJ3 Work build is connected to the wrong Supabase project. Expected ref: $EXPECTED_PROJECT_REF; received ref: $ACTUAL_PROJECT_REF"
            exit 1
          fi
          echo "Supabase URL and publishable key are present; project ref is DJ3 Work."

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PAGES_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PAGES_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
